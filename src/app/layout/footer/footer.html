<footer class="footer">
  <div class="columnas">
    <section>
      <h3>Clínica Virtual</h3>
      <p class="dato"><mat-icon>location_on</mat-icon>{{ contacto.direccion }}</p>
    </section>

    <section>
      <h3>Contacto</h3>
      <p class="dato">
        <mat-icon>call</mat-icon>
        <a [href]="'tel:' + contacto.telefono">{{ contacto.telefono }}</a>
      </p>
      <p class="dato">
        <mat-icon>mail</mat-icon>
        <a [href]="'mailto:' + contacto.email">{{ contacto.email }}</a>
      </p>
    </section>

    <section>
      <h3>Redes sociales</h3>
      <div class="redes">
        @for (red of redes; track red.nombre) {
          <a
            mat-icon-button
            [href]="red.url"
            target="_blank"
            rel="noopener"
            [matTooltip]="red.nombre"
            [attr.aria-label]="red.nombre"
          >
            <mat-icon>{{ red.icono }}</mat-icon>
          </a>
        }
      </div>
    </section>
  </div>

  <mat-divider />
  <p class="copy">© {{ anio }} Clínica Virtual. Todos los derechos reservados.</p>
</footer>
