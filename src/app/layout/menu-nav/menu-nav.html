<mat-nav-list>
  <a
    mat-list-item
    routerLink="/"
    routerLinkActive
    #inicio="routerLinkActive"
    [routerLinkActiveOptions]="{ exact: true }"
    [activated]="inicio.isActive"
    (click)="navegar.emit()"
  >
    <mat-icon matListItemIcon>home</mat-icon>
    <span matListItemTitle>Inicio</span>
  </a>

  <mat-divider />
  <h3 matSubheader>{{ tituloSeccion() }}</h3>

  @for (item of items(); track item.path) {
    <a
      mat-list-item
      [routerLink]="['/', rol(), item.path]"
      routerLinkActive
      #rla="routerLinkActive"
      [activated]="rla.isActive"
      (click)="navegar.emit()"
    >
      <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
      <span matListItemTitle>{{ item.label }}</span>
    </a>
  }

  <mat-divider />
  <a
    mat-list-item
    routerLink="/perfil"
    routerLinkActive
    #perfil="routerLinkActive"
    [activated]="perfil.isActive"
    (click)="navegar.emit()"
  >
    <mat-icon matListItemIcon>person</mat-icon>
    <span matListItemTitle>Mi perfil</span>
  </a>
</mat-nav-list>
